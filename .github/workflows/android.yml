name: Build Barrio Abierto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true

      - name: Instalar herramientas Android
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Verificar archivos
        run: |
          test -f project.godot
          test -f export_presets.cfg

      - name: Crear carpeta
        run: mkdir -p build

      - name: Exportar APK
        run: godot --headless --path . --export-debug "Android" build/barrio-abierto.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: barrio-abierto-apk
          path: build/barrio-abierto.apk
          if-no-files-found: error
